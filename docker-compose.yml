services:
  # Ollama service for local AI models
  ollama:
    image: ollama/ollama:latest
    container_name: translator-ollama
    runtime: nvidia
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - translator-network
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: translator-backend
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    networks:
      - translator-network
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: translator-frontend
    ports:
      - "3000:80"
    networks:
      - translator-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Llama.cpp server for KazLLM-8B GGUF model
  # OPTIONAL: Only starts if kazllm-8b is enabled in config.yaml
  # Enable with: docker compose --profile issai up -d
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: translator-llamacpp
    runtime: nvidia
    profiles: ["issai"]  # Optional service - start with --profile issai
    volumes:
      - kazllm_models:/models
    ports:
      - "8080:8080"
    networks:
      - translator-network
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --server
      --host 0.0.0.0
      --port 8080
      -m /models/llama-3.1-kazllm-1.0-8b-q4_k_m.gguf
      -c 4096
      -n 512
      -ngl 99
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ISSAI Qolda multimodal model
  # OPTIONAL: Docker image not publicly available
  # Enable with: docker compose --profile issai up -d
  qolda:
    image: issai/qolda:latest
    container_name: translator-qolda
    runtime: nvidia
    profiles: ["issai"]  # Optional service - requires custom Docker image
    ports:
      - "8081:8000"
    networks:
      - translator-network
    restart: unless-stopped
    environment:
      - MODEL_PATH=/app/models
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  translator-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  kazllm_models:
    driver: local
