# Multi-Model Translation Service Configuration

# AI Models Configuration
# Supported types: ollama, openai, anthropic, google
models:
  # Ollama Local Models
  - name: llama3
    type: ollama
    model_id: llama3
    weight: 1.0
    enabled: true
    timeout: 60

  - name: qwen2
    type: ollama
    model_id: qwen2
    weight: 1.0
    enabled: true
    timeout: 60

  # OpenAI Models (uncomment and configure API key in .env)
