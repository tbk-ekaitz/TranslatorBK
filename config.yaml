# Translation Configuration per Target Language
translation:
  ru:  # Russian
    system_prompt: "You are a professional translator specializing in Russian translations. Translate the following text accurately, naturally, and idiomatically into Russian."
    temperature: 0.3
    max_tokens: 2000

  kk:  # Kazakh
    system_prompt: "You are a professional translator specializing in Kazakh translations. Translate the following text accurately, naturally, and idiomatically into Kazakh."
    temperature: 0.3
    max_tokens: 2000

# Evaluation Settings
# Note: These are overridden by environment variables if set
evaluation:
  method: consensus  # Options: consensus, scoring, weighted_vote
  consensus_threshold: 0.7  # Similarity threshold for grouping translations (0.0-1.0)
