# Multi-Model Translation Service Configuration
# For Kazakh and Russian translation

# AI Models Configuration
# Note: Each model specifies which target languages (ru, kk) and source languages (en, zh-TW) it supports

models:
  # ===== T-pro-it-2.0 - Advanced Russian Reasoning Model (Ollama) =====
  # Best for: Complex Russian translations with reasoning
  # Size: 33B parameters (requires powerful hardware)
  # Note: Excellent for Russian, limited Kazakh support
  # Download: ollama pull t-tech/t-pro-it-2.0:q4_k_m
  - name: t-pro-it-2.0
    type: ollama
    model_id: t-tech/t-pro-it-2.0:q4_k_m
    weight: 1.5
    enabled: true
    timeout: 120
    supported_target_languages: ["ru"]  # Only Russian (Kazakh is limited)
    supported_source_languages: ["en", "zh-TW"]  # Supports both

  # ===== Llama 3.1 - General Purpose Multilingual Model (Ollama) =====
  # Best for: Kazakh translations, general multilingual support
  # Size: Available in multiple sizes (8B, 70B)
  # Download: ollama pull llama3.1
  - name: llama3.1
    type: ollama
    model_id: llama3.1
    weight: 1.2
    enabled: true
    timeout: 90
    supported_target_languages: ["ru", "kk"]  # Supports both
    supported_source_languages: ["en", "zh-TW"]  # Supports both

  # ===== Qwen 2.5 - Multilingual Model with Good CJK Support (Ollama) =====
  # Best for: Chinese source texts, multilingual support
  # Size: Available in multiple sizes
  # Download: ollama pull qwen2.5
  - name: qwen2.5
    type: ollama
    model_id: qwen2.5
    weight: 1.2
    enabled: true
    timeout: 90
    supported_target_languages: ["ru", "kk"]  # Supports both
    supported_source_languages: ["en", "zh-TW"]  # Excellent Chinese support

  # ===== DeepSeek V2.5 - Coding & Multilingual Model (Ollama) =====
  # Best for: Technical translations
  # Download: ollama pull deepseek-v2.5
  - name: deepseek-v2.5
    type: ollama
    model_id: deepseek-v2.5
    weight: 1.1
    enabled: false  # Disabled by default
    timeout: 90
    supported_target_languages: ["ru", "kk"]
    supported_source_languages: ["en", "zh-TW"]

  # ===== ISSAI KazLLM-8B - Kazakh National Model (via llama.cpp) =====
  # Best for: Professional Kazakh translations, cultural context
  # Size: 8B parameters (~5GB GGUF Q4_K_M)
  # Download: Run ./scripts/download-kazllm.sh first
  - name: kazllm-8b
    type: llamacpp
    model_id: llama-3.1-kazllm-1.0-8b-q4_k_m
    base_url: http://llamacpp:8080
    weight: 1.6  # Higher weight - specialized Kazakh model
    enabled: true
    timeout: 90
    supported_target_languages: ["ru", "kk"]  # Excellent for both
    supported_source_languages: ["en", "zh-TW"]  # Supports both

  # ===== ISSAI Qolda - Lightweight Multimodal Model (Docker) =====
  # Best for: Fast translation with multimodal capabilities
  # Size: 4.3B parameters (very efficient)
  # Automatically deployed via Docker
  - name: qolda
    type: qolda
    model_id: issai/Qolda
    base_url: http://qolda:8000
    weight: 1.3
    enabled: true
    timeout: 60
    supported_target_languages: ["ru", "kk"]  # Excellent for both
    supported_source_languages: ["en", "zh-TW"]  # Supports both

  # ===== ISSAI Tilmash - Specialized Translation Model =====
  # ⚠️ GATED MODEL: Requires Hugging Face account approval
  # URL: https://huggingface.co/issai/tilmash
  # NOT IMPLEMENTED - Requires transformers integration + HF approval
  # - name: tilmash
  #   type: huggingface  # Would need custom implementation
  #   model_id: issai/tilmash
  #   ...

  # ===== Example: OpenAI Models (if you have API key) =====
  # - name: gpt-4
  #   type: openai
  #   model_id: gpt-4-turbo-preview
  #   weight: 1.5
  #   enabled: false
  #   timeout: 60
  #   supported_target_languages: ["ru", "kk"]
  #   supported_source_languages: ["en", "zh-TW"]

  # ===== Example: Anthropic Models (if you have API key) =====
  # - name: claude-3-opus
  #   type: anthropic
  #   model_id: claude-3-opus-20240229
  #   weight: 1.5
  #   enabled: false
  #   timeout: 60
  #   supported_target_languages: ["ru", "kk"]
  #   supported_source_languages: ["en", "zh-TW"]

# Translation Configuration per Target Language
# System prompts are written in the target language for better model performance
translation:
  ru:  # Russian - Prompt in Russian
    system_prompt: "Вы профессиональный переводчик, специализирующийся на переводах на русский язык. Переведите следующий текст точно, естественно и идиоматично на русский язык. Сохраните смысл, тон и стиль исходного текста. Предоставьте ТОЛЬКО перевод, без пояснений или дополнительного текста."
    temperature: 0.3
    max_tokens: 2000

  kk:  # Kazakh - Prompt in Kazakh (Cyrillic)
    system_prompt: "Сіз қазақ тіліне аударуға маманданған кәсіби аудармашысыз. Келесі мәтінді қазақ тіліне (кирилл жазуында) дәл, табиғи және идиоматикалық түрде аударыңыз. Түпнұсқа мәтіннің мағынасын, үнін, мәдени контекстін және стилін сақтаңыз. ТЕК аударманы ұсыныңыз, түсініктемелерсіз немесе қосымша мәтінсіз."
    temperature: 0.3
    max_tokens: 2000

# Evaluation Settings
evaluation:
  method: consensus  # Options: consensus, scoring, weighted_vote
  consensus_threshold: 0.7  # Similarity threshold for grouping translations (0.0-1.0)

# ================================================================================
# OLLAMA MODEL DOWNLOAD INSTRUCTIONS:
# ================================================================================
#
# These models are CONFIRMED to work with Ollama:
#
# 1. T-pro-it-2.0 (Russian specialist, 33B - requires 20GB+ VRAM):
#    ollama pull t-tech/t-pro-it-2.0:q4_k_m
#
# 2. Llama 3.1 (Multilingual, 8B):
#    ollama pull llama3.1
#
# 3. Qwen 2.5 (Multilingual with excellent Chinese support):
#    ollama pull qwen2.5
#
# 4. DeepSeek V2.5 (Optional - technical translations):
#    ollama pull deepseek-v2.5
#
# Run these commands AFTER starting the Docker containers:
#    docker exec translator-ollama ollama pull llama3.1
#    docker exec translator-ollama ollama pull qwen2.5
#    docker exec translator-ollama ollama pull t-tech/t-pro-it-2.0:q4_k_m
#
# ================================================================================
# ISSAI MODELS - ADVANCED SETUP (OPTIONAL):
# ================================================================================
#
# The specialized ISSAI models (Tilmash, Qolda, KazLLM) are NOT available in Ollama.
# They require custom integration:
#
# Option 1: Use ISSAI Qolda via Docker
#   git clone https://github.com/IS2AI/Qolda-deployment
#   cd Qolda-deployment
#   docker-compose up -d
#   # Then modify backend to call Qolda's API
#
# Option 2: Use KazLLM-8B with llama.cpp (GGUF)
#   # Download GGUF from: https://huggingface.co/issai/LLama-3.1-KazLLM-1.0-8B-GGUF4
#   # Run with llama.cpp server
#   # Modify backend to call llama.cpp API
#
# Option 3: Use Tilmash (requires HF approval)
#   1. Go to https://huggingface.co/issai/tilmash
#   2. Click "Access repository" and accept conditions
#   3. Wait for approval
#   4. Integrate via transformers in Python backend
#
# For now, the system uses general-purpose Ollama models that work well
# for Kazakh and Russian translations.
#
# ================================================================================
# MODEL SELECTION GUIDE:
# ================================================================================
#
# For ENGLISH → RUSSIAN:
#   - T-pro-it-2.0: Excellent (specialized Russian model)
#   - Llama 3.1: Very good
#   - Qwen 2.5: Very good
#
# For ENGLISH → KAZAKH:
#   - Llama 3.1: Very good (best general-purpose for Kazakh)
#   - Qwen 2.5: Very good
#   - T-pro-it-2.0: Limited (not recommended for Kazakh)
#
# For CHINESE → RUSSIAN:
#   - Qwen 2.5: Excellent (best Chinese support)
#   - T-pro-it-2.0: Very good
#   - Llama 3.1: Good
#
# For CHINESE → KAZAKH:
#   - Qwen 2.5: Excellent (best for Chinese → Kazakh)
#   - Llama 3.1: Very good
#
# The system automatically selects compatible models based on source/target languages.
# ================================================================================

